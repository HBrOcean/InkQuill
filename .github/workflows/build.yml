name: Build

# 触发方式：
#   1) 推送 tag（如 v1.2）—— 打包三平台产物，并自动挂到 Release
#   2) 网页手动触发（Actions → Build → Run workflow）—— 只产出 Artifacts
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ---- Linux 还需要这些系统库，Qt 才能在无头环境里跑起来 ----
      - name: Install Linux GUI libs (Qt)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk xvfb \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt PySide6 pyinstaller pytest

      # ---- 质量关卡：不过就不打包 ----
      - name: Self-test (algorithm)
        run: python inkquill.py --selftest

      - name: Unit tests
        run: python -m pytest -q

      - name: GUI self-test (headless, Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python inkquill.py --gui-selftest

      # ---- 打包 ----
      - name: Build with PyInstaller
        run: python build.py

      # ---- 收集产物（按平台分别处理，避免一把梭踩坑）----
      - name: Collect artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p out
          cp dist/inkquill.exe out/inkquill-windows-x64.exe
          ls -lh out

      - name: Collect artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          cp dist/inkquill out/inkquill-linux-x64
          chmod +x out/inkquill-linux-x64
          ls -lh out

      - name: Collect artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          if [ -d dist/inkquill.app ]; then
            (cd dist && zip -qry ../out/inkquill-macos.zip inkquill.app)
          elif [ -f dist/inkquill ]; then
            cp dist/inkquill out/inkquill-macos
          fi
          ls -lh out

      - name: Show build output (debug)
        if: always()
        shell: bash
        run: |
          echo "--- dist ---"; ls -lh dist || true
          echo "--- out ---";  ls -lh out  || true

      # ---- 上传为 Artifact ----
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkquill-${{ matrix.os }}
          path: out/*
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  # ===== 打 tag 时：把三个产物自动挂到 Release =====
  release:
    name: Attach to Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: find artifacts -type f | sort

      - name: Publish Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
