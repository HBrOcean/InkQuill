name: Build

# 推送 tag（如 v1.1）或手动触发时，自动为三大系统各打一个包
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux GUI libs (Qt + tk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk xvfb \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0

      - name: Install macOS tkinter
        if: runner.os == 'macOS'
        run: brew install python-tk@3.12 || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt PySide6 pyinstaller pytest

      - name: Self-test
        run: python inkquill.py --selftest

      - name: Unit tests
        run: python -m pytest -q

      - name: GUI self-test (headless, Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python inkquill.py --gui-selftest

      - name: Build
        run: python build.py

      - name: Rename artifacts
        shell: bash
        run: |
          mkdir -p out
          if [ -f dist/inkquill.exe ]; then cp dist/inkquill.exe out/inkquill-windows-x64.exe; fi
          if [ -f dist/inkquill ]; then cp dist/inkquill out/inkquill-linux-x64; chmod +x out/inkquill-linux-x64; fi
          if [ -d dist/inkquill.app ]; then (cd dist && zip -qry ../out/inkquill-macos.zip inkquill.app); fi
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkquill-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  release:
    name: Attach to Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
